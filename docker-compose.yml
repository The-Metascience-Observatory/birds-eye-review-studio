# Optional Postgres + Redis for local development.
#
# Redis is REQUIRED by the studio (the arq job queue for both workers, and the
# rate-limit counters). Postgres is optional: the server defaults to sqlite
# (DATABASE_URL=sqlite+aiosqlite:///./server/dev.db); use this one by setting
#   DATABASE_URL=postgresql+asyncpg://bird:bird@localhost:5432/bird
# in server/.env.
#
# Both ports are published on 127.0.0.1 ONLY: a database or queue reachable
# from the LAN is a database or queue anyone on the LAN can read and write.
#
# Redis requires a password. The default below is for a local machine; set
# REDIS_PASSWORD in the environment (or a .env file next to this one) to change
# it, and point the server at it in server/.env:
#   REDIS_URL=redis://:bird-local-dev@localhost:6379/0
# The Postgres credentials are likewise local-only placeholders.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bird
      POSTGRES_PASSWORD: bird
      POSTGRES_DB: bird
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bird_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-bird-local-dev}"]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  bird_pgdata:
